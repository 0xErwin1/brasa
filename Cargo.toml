[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
logos = "0.15"
clap = { version = "4.5", features = ["derive"] }
insta = { version = "1.43", features = ["yaml"] }
criterion = "0.8"
ariadne = "0.5"
# Built-in string regex methods (spec: 05 — Stdlib de scripting): pinned to
# the 1.x line, linear-time engine, same syntax the spec promises for
# `std::re`.
regex = "1.13"
# `fs.glob` (spec: 05 — Stdlib de scripting, BRS-33): the rust-lang glob
# crate, pinned to the 0.3 line — dependency-free and boring.
glob = "0.3"
# `std::json` (spec: 05 — Stdlib de scripting, BRS-34): serde_json's parser
# and serializer over its own `Value` tree, pinned to the 1.x line. No
# derive/serde features: the runtime only needs the boring, correct
# `Value` representation (default BTreeMap objects — deterministic,
# bytewise-sorted keys).
serde_json = "1"
# `std::http` (spec: 05 — Stdlib de scripting, BRS-113): a BLOCKING client, so
# no async runtime reaches a synchronous scripting language. rustls
# rather than a system TLS library keeps the build self-contained, and
# nothing here runs until the first request — the cold-start number is
# the gate this dependency had to pass.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The LSP (spec: 00 — Visión y alcance, M5 — BRS-92). rust-analyzer's own
# transport and protocol types: `lsp-server` is SYNCHRONOUS, so no async
# runtime reaches a compiler that has none, which is the same gate ureq
# had to pass. `lsp-types` is data — the protocol's structs, versioned
# with it — and is what stops the server from hand-spelling a wire format
# that some client reads differently.
#
# These are the first dependencies to pull serde's derive, which the
# serde_json pin above had deliberately avoided. That pin was about the
# RUNTIME: `std::json` needs a Value tree, not a schema. A protocol is
# the opposite case — it IS a schema, and the derive is what keeps it
# honest.
serde = { version = "1", features = ["derive"] }
# The terminal UI (BRS-120, BRS-90). Confined to `brasa_tui`, which
# nothing in the compiler depends on — a dependency the language's own
# pipeline never sees. ratatui is the maintained successor to tui-rs and
# brings its own `TestBackend`, so the views render into a buffer a test
# can assert on: a TUI here is not the untestable shell it usually is.
# The project manifest, `brasa.toml` (spec: 00 — Visión y alcance): the
# canonical Rust TOML parser, driven through serde's derive so a typo'd
# key is a parse error rather than a silently ignored table. Confined to
# the CLI crate — the compiler pipeline never learns what a manifest is,
# which is what keeps a standalone script running with no project
# around it.
toml = "0.9"
ratatui = "0.30"
crossterm = "0.29"
lsp-server = "0.10"
lsp-types = "0.97"

brasa_arena = { path = "crates/brasa_arena" }
brasa_source = { path = "crates/brasa_source" }
brasa_diagnostics = { path = "crates/brasa_diagnostics" }
brasa_token = { path = "crates/brasa_token" }
brasa_lexer = { path = "crates/brasa_lexer" }
brasa_ast = { path = "crates/brasa_ast" }
brasa_parser = { path = "crates/brasa_parser" }
brasa_hir = { path = "crates/brasa_hir" }
brasa_module = { path = "crates/brasa_module" }
brasa_lsp = { path = "crates/brasa_lsp" }
brasa_dap = { path = "crates/brasa_dap" }
brasa_tui = { path = "crates/brasa_tui" }
brasa_resolver = { path = "crates/brasa_resolver" }
brasa_typeck = { path = "crates/brasa_typeck" }
brasa_errorset = { path = "crates/brasa_errorset" }
brasa_runtime = { path = "crates/brasa_runtime" }
brasa_stdlib = { path = "crates/brasa_stdlib" }
brasa_bytecode = { path = "crates/brasa_bytecode" }
brasa_codegen = { path = "crates/brasa_codegen" }
brasa_vm = { path = "crates/brasa_vm" }
brasa_fmt = { path = "crates/brasa_fmt" }

[workspace.package]
authors = ["Ignacio Perez <ignacio@feuer.me>"]
description = "The Brasa programming language"
keywords = ["programming", "language", "interpreter", "scripting"]
license = "GPL-3.0"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
